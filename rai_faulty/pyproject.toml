[build-system]

requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rai_faulty"
version = "0.0.1"
description = "Package description goes here."
authors = [
	{name = "John Doe", email = "no@email.com"}
	]
license = "GPL-3.0-only"
readme = "README.md"
classifiers = [
	'Programming Language :: Python :: 3',
	]
requires-python = ">=3.11"
dependencies = [
    'raimad==1.3.0',
	]

[project.optional-dependencies]
dev = [
	"mypy",
	"ruff",
	"twine",
	"build",
	]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "D",
    ]
ignore = [
    "D106",
    # Allow no docstring in nested classes
    # (e.g. Layers, Options, Marks classes)
    "D401",  # don't complain about "imperative mood"
    "D202",  # Allow blank line after docstring
    ]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
strict = true

# Files/dirs to check.
files = [
	"src",
	"tests",
]

# Exclude specific files
exclude = [
	]

# don't complain about missing -> None return annotation
# in test methods
[[tool.mypy.overrides]]
strict = false
module = 'tests.*'
disallow_untyped_defs = false

