name: main

on:
  push:
    tags:
      - "v*"

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark repo as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build and push image
        run: |
          docker build . --tag ${{ github.repository }}:main
          docker push ${{ github.repository }}:main

      #- name: Run tooling
      #  run: |
      #    mkdir ./exfil
      #    docker run -v ./exfil:/exfil --rm --init ${{ github.repository }}:main

  run-tooling:
    runs-on: ubuntu-latest
    needs: build-image

    container:
      image: ghcr.io/${{ github.repository }}:main
      options: --user root

    steps:
      - name: Run tooling script
        run: ./scripts/tooling-summary.sh

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            /tmp/raimad-tooling.json

