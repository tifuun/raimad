name: main

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create release + upload assets
  packages: write   # pull and push images

jobs:
  build-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark repo as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build . --tag ghcr.io/${{ github.repository }}:main

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}:main
      #- name: foo
      #  run: true

  run-tooling:
    runs-on: ubuntu-latest
    needs: build-image

    container:
      image: ghcr.io/${{ github.repository }}:main
      options: --user root

    steps:
      - name: Run tooling script
        run: |
          cd /raimad-source
          ./scripts/tooling-summary.sh

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            /tmp/raimad-tooling.json

